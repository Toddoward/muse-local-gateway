<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Muse reaches from its cloud computer to a workbench on your computer and builds its own gadget">
<style>.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;letter-spacing:.12em} .s{font-family:system-ui, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif}.x{transform-box:fill-box;transform-origin:left center} .c{transform-box:fill-box;transform-origin:center} .a{animation-duration:12s;animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:cubic-bezier(.2,.7,.2,1)}@media (prefers-reduced-motion:reduce){.a{animation:none!important}}@keyframes end-sc0{0%,0%{opacity:0}2.5%,18.5%{opacity:1}21%,100%{opacity:0}}@keyframes end-sc1{0%,21%{opacity:0}23.5%,39.5%{opacity:1}42%,100%{opacity:0}}@keyframes end-sc2{0%,42%{opacity:0}44.5%,68.5%{opacity:1}71%,100%{opacity:0}}@keyframes end-sc3{0%,71%{opacity:0.0}73.5%,95%{opacity:1}100%{opacity:0.0}}@keyframes end-breathe{0%,100%{transform:scale(1);opacity:.25}50%{transform:scale(1.25);opacity:.05}}@keyframes end-task1{0%{transform:scaleX(0)}20%,100%{transform:scaleX(1)}} @keyframes end-task2{0%,4%{transform:scaleX(0)}21%,100%{transform:scaleX(1)}} @keyframes end-task3{0%,8%{transform:scaleX(0)}20%,100%{transform:scaleX(1)}}@keyframes end-reach{0%,21%{stroke-dashoffset:118;opacity:1}29%,42%{stroke-dashoffset:0;opacity:1}44%,100%{stroke-dashoffset:0;opacity:0}}@keyframes end-reachInk{0%,42%{opacity:0}44%,95%{opacity:1}100%{opacity:0}}@keyframes end-wake{0%,24%{opacity:.35}30%,100%{opacity:1}}@keyframes end-drop{0%,31%{transform:translateY(-58px);opacity:0}33%{opacity:1}38%,100%{transform:translateY(0);opacity:1}}@keyframes end-t1{0%,44%{opacity:0.0}46%,95%{opacity:1}100%{opacity:0.0}}@keyframes end-t2{0%,58%{opacity:0.0}60%,95%{opacity:1}100%{opacity:0.0}}@keyframes end-t3{0%,66%{opacity:0.0}68%,95%{opacity:1}100%{opacity:0.0}}@keyframes end-bar{0%,46%{transform:scaleX(0)}56%,100%{transform:scaleX(1)}}@keyframes end-barColor{0%,70%{fill:#80ADFF}72%,100%{fill:#F2F0EC}}@keyframes end-flow{0%,58%{stroke-dashoffset:24;opacity:0}59%{opacity:1}66%{stroke-dashoffset:0;opacity:1}68%,100%{stroke-dashoffset:0;opacity:.4}}@keyframes end-lit{0%,71%{fill:#303440}73%,95%{fill:#80ADFF}100%{fill:#303440}}@keyframes end-wave{0%,72%{opacity:0;transform:scale(.6)}80%{opacity:1;transform:scale(1)}88%{opacity:.2;transform:scale(1.15)}96%,100%{opacity:0}}@keyframes end-back{0%,74%{opacity:0}82%,95%{opacity:1}100%{opacity:0}}@keyframes end-blink{0%,49%{opacity:1}50%,100%{opacity:0}}</style>
<defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#242A36"/></pattern></defs>
<rect width="1200" height="520" rx="24" fill="#16161D"/><rect width="1200" height="520" rx="24" fill="url(#g)"/>
<g class="a" style="animation-name:end-sc0;opacity:0"><text x="48" y="58" class="m" font-size="13" fill="#F2F0EC">01 / IN THE CLOUD</text><text x="48" y="86" class="s" font-size="17" fill="#AEB4C2">Muse works on</text><text x="48" y="110" class="s" font-size="17" fill="#AEB4C2">a computer of its own.</text></g><g class="a" style="animation-name:end-sc1;opacity:0"><text x="48" y="58" class="m" font-size="13" fill="#F2F0EC">02 / HANDS AND FEET</text><text x="48" y="86" class="s" font-size="17" fill="#AEB4C2">Local Gateway lets it reach</text><text x="48" y="110" class="s" font-size="17" fill="#AEB4C2">the computer right beside you.</text></g><g class="a" style="animation-name:end-sc2;opacity:0"><text x="48" y="58" class="m" font-size="13" fill="#F2F0EC">03 / AT THE WORKBENCH</text><text x="48" y="86" class="s" font-size="17" fill="#AEB4C2">A fenced shell, a shared folder,</text><text x="48" y="110" class="s" font-size="17" fill="#AEB4C2">and the board on your desk.</text></g><g class="a" style="animation-name:end-sc3;opacity:1"><text x="48" y="58" class="m" font-size="13" fill="#F2F0EC">04 / ITS OWN EARS AND VOICE</text><text x="48" y="86" class="s" font-size="17" fill="#AEB4C2">Muse just built the gadget</text><text x="48" y="110" class="s" font-size="17" fill="#AEB4C2">it will listen and speak through.</text></g>
<g transform="translate(130 0)">
<!-- the cloud -->
<rect x="430" y="40" width="340" height="112" rx="16" fill="#16161D" stroke="#303440" stroke-width="1.5" stroke-dasharray="6 6"/>
<text x="450" y="64" class="m" font-size="10.5" fill="#AEB4C2">MUSE SECURE VM</text>
<circle class="a c" cx="510" cy="106" r="26" fill="#F2F0EC" style="animation-name:end-breathe;animation-duration:3s;opacity:.15"/>
<circle cx="510" cy="106" r="17" fill="#F2F0EC"/>
<rect x="556" y="90" width="180" height="6" rx="3" fill="#303440"/><rect class="a x" x="556" y="90" width="120" height="6" rx="3" fill="#F2F0EC" style="animation-name:end-task1"/><rect x="556" y="104" width="180" height="6" rx="3" fill="#303440"/><rect class="a x" x="556" y="104" width="84" height="6" rx="3" fill="#F2F0EC" style="animation-name:end-task2"/><rect x="556" y="118" width="180" height="6" rx="3" fill="#303440"/><rect class="a x" x="556" y="118" width="150" height="6" rx="3" fill="#F2F0EC" style="animation-name:end-task3"/>
<!-- the reach: hands and feet -->
<path class="a" d="M600 152 V270" stroke="#80ADFF" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="118" style="animation-name:end-reach;opacity:0"/>
<path class="a" d="M600 152 V270" stroke="#F2F0EC" stroke-width="1.5" style="animation-name:end-reachInk"/>
<!-- your computer -->
<g class="a" style="animation-name:end-wake">
<rect x="250" y="226" width="760" height="276" rx="20" fill="none" stroke="#303440" stroke-width="1.5" stroke-dasharray="6 6"/>
<text x="270" y="250" class="m" font-size="10.5" fill="#AEB4C2">YOUR COMPUTER</text>
<rect x="430" y="270" width="340" height="196" rx="12" fill="#1B222E" stroke="#F2F0EC" stroke-width="1.5"/>
<circle cx="448" cy="286" r="3.5" fill="#303440"/><circle cx="460" cy="286" r="3.5" fill="#303440"/><circle cx="472" cy="286" r="3.5" fill="#303440"/>
<path d="M290 392 h30 l8 -10 h44 a6 6 0 0 1 6 6 v58 a6 6 0 0 1 -6 6 h-76 a6 6 0 0 1 -6 -6 z" fill="#1B222E" stroke="#F2F0EC" stroke-width="1.5"/>
<rect class="a" x="314" y="398" width="28" height="34" rx="3" fill="#16161D" stroke="#F2F0EC" stroke-width="1.2" style="animation-name:end-drop"/>
<text x="290" y="478" class="s" font-size="12" fill="#AEB4C2">shared folder</text>
<path class="a" d="M770 404 H850" stroke="#F2F0EC" stroke-width="1.5" stroke-dasharray="4 4" style="animation-name:end-flow"/>
<rect x="850" y="362" width="76" height="84" rx="10" fill="#1B222E" stroke="#F2F0EC" stroke-width="1.5"/>
<rect class="a" x="862" y="376" width="52" height="40" rx="6" fill="#80ADFF" style="animation-name:end-lit"/>
<text x="850" y="478" class="m" font-size="10.5" fill="#AEB4C2">ESP32-S3</text>
<path class="a" d="M958 382 A10 10 0 0 1 958 402" fill="none" stroke="#80ADFF" stroke-width="2" stroke-linecap="round" style="animation-name:end-wave;animation-delay:0s;transform-box:fill-box;transform-origin:left center"/><path class="a" d="M968 372 A20 20 0 0 1 968 412" fill="none" stroke="#80ADFF" stroke-width="2" stroke-linecap="round" style="animation-name:end-wave;animation-delay:0.15s;transform-box:fill-box;transform-origin:left center"/><path class="a" d="M978 362 A30 30 0 0 1 978 422" fill="none" stroke="#80ADFF" stroke-width="2" stroke-linecap="round" style="animation-name:end-wave;animation-delay:0.3s;transform-box:fill-box;transform-origin:left center"/>
</g>
<g class="m" font-size="13.5">
<text class="a" x="450" y="322" fill="#F2F0EC" style="animation-name:end-t1">$ idf.py build</text>
<rect x="450" y="334" width="300" height="5" rx="2.5" fill="#303440" class="a" style="animation-name:end-t1"/>
<rect class="a x" x="450" y="334" width="300" height="5" rx="2.5" fill="#F2F0EC" style="animation-name:end-bar,end-barColor"/>
<text class="a" x="450" y="370" fill="#F2F0EC" style="animation-name:end-t2">$ idf.py -p /dev/ttyACM0 flash</text>
<text class="a" x="450" y="398" fill="#AEB4C2" style="animation-name:end-t3">link.main: Muse Gadget starting</text>
<text class="a" x="450" y="438" fill="#F2F0EC" style="animation-name:end-blink;animation-duration:1s;animation-timing-function:steps(1)">$ _</text>
</g>
<!-- the gadget talks back to Muse over Wi-Fi -->
<path class="a" d="M888 362 C 900 250, 860 120, 772 100" fill="none" stroke="#AEB4C2" stroke-width="1.5" stroke-dasharray="5 6" style="animation-name:end-back;opacity:1"/>
</g>
</svg>
