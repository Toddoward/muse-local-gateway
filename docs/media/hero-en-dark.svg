<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Muse reaches from its cloud computer to a workbench on your computer, where it can build its own gadget">
<style>.t{font-family:Pretendard, 'Pretendard Variable', system-ui, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', sans-serif} .m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace} .lb{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;letter-spacing:.08em}.a{animation-duration:15s;animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:cubic-bezier(.2,.7,.2,1)}@media (prefers-reduced-motion:reduce){.a{animation:none!important}}@keyframes end-sc0{16.00%,16.00%{opacity:0}19.14%,28.55%{opacity:1}31.69%,90.70%{opacity:0}}@keyframes end-sc1{16.00%,31.69%{opacity:0}34.82%,44.24%{opacity:1}47.37%,90.70%{opacity:0}}@keyframes end-sc2{16.00%,47.37%{opacity:0}50.51%,65.90%{opacity:1}69.04%,90.70%{opacity:0}}@keyframes end-sc3{16.00%,69.04%{opacity:0}72.17%,87.71%{opacity:1}90.70%{opacity:0}}@keyframes end-task{16.00%{stroke-dashoffset:184}29.45%,90.70%{stroke-dashoffset:var(--o)}}@keyframes end-reach{16.00%,31.69%{stroke-dashoffset:70;opacity:1}36.92%,47.37%{stroke-dashoffset:0;opacity:1}50.36%,90.70%{opacity:0}}@keyframes end-reachInk{16.00%,47.37%{opacity:0}50.36%,87.71%{opacity:1}90.70%{opacity:0}}@keyframes end-wake{16.00%,33.93%{opacity:.3}37.66%,87.71%{opacity:1}90.70%{opacity:.3}}@keyframes end-rise{16.00%,38.41%{opacity:0;transform:translateY(14px)}42.14%,87.71%{opacity:1;transform:translateY(0)}90.70%{opacity:0}}@keyframes end-l1{16.00%,48.87%{opacity:0;transform:translateY(14px)}52.60%,87.71%{opacity:1;transform:translateY(0)}90.70%{opacity:0}}@keyframes end-l2{16.00%,59.33%{opacity:0;transform:translateY(14px)}63.06%,87.71%{opacity:1;transform:translateY(0)}90.70%{opacity:0}}@keyframes end-l3{16.00%,69.78%{opacity:0;transform:translateY(14px)}73.52%,87.71%{opacity:1;transform:translateY(0)}90.70%{opacity:0}}@keyframes end-bar{16.00%,51.86%{stroke-dashoffset:264}59.33%,90.70%{stroke-dashoffset:0}}@keyframes end-barc{16.00%,68.29%{stroke:#70BEFF}70.53%,90.70%{stroke:#B5B7BB}}@keyframes end-flow{16.00%,60.07%{opacity:0}62.31%,66.80%{opacity:1}69.04%,90.70%{opacity:.35}}@keyframes end-lit{16.00%,69.04%{fill:#383B3D}72.03%,87.71%{fill:#70BEFF}90.70%{fill:#383B3D}}@keyframes end-wave{16.00%,70.53%{opacity:0}75.01%{opacity:1}80.24%{opacity:.25}83.98%{opacity:1}87.71%,90.70%{opacity:0}}@keyframes end-back{16.00%,72.77%{opacity:0}77.25%,87.71%{opacity:1}90.70%{opacity:0}}@keyframes end-blink{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes end-logo{0%,10.7%{transform:translate(498px,88px) scale(.4)}16%,90.7%{transform:translate(68px,26px) scale(.11)}96%,100%{transform:translate(498px,88px) scale(.4)}}@keyframes end-bigname{0%,9%{opacity:1}12%,93%{opacity:0}96%,100%{opacity:1}}@keyframes end-smallname{0%,14%{opacity:0}17%,89%{opacity:1}91%,100%{opacity:0}}@keyframes end-stage{0%,15%{opacity:0}18%,89.5%{opacity:1}92%,100%{opacity:0}}@keyframes end-seg0{0%,16.0%{stroke-dashoffset:40}31.7%,100%{stroke-dashoffset:0}}@keyframes end-seg1{0%,31.7%{stroke-dashoffset:40}47.4%,100%{stroke-dashoffset:0}}@keyframes end-seg2{0%,47.4%{stroke-dashoffset:40}69.0%,100%{stroke-dashoffset:0}}@keyframes end-seg3{0%,69.0%{stroke-dashoffset:40}90.7%,100%{stroke-dashoffset:0}}</style>
<defs><radialGradient id="l0" cx="70" cy="40" r="560" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="rgb(0, 151, 255)" stop-opacity="0.14"/><stop offset=".62" stop-color="rgb(0, 151, 255)" stop-opacity="0"/></radialGradient><radialGradient id="l1" cx="1180" cy="90" r="470" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="rgb(255, 74, 194)" stop-opacity="0.09"/><stop offset=".62" stop-color="rgb(255, 74, 194)" stop-opacity="0"/></radialGradient><radialGradient id="l2" cx="1080" cy="540" r="600" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="rgb(255, 162, 81)" stop-opacity="0.12"/><stop offset=".62" stop-color="rgb(255, 162, 81)" stop-opacity="0"/></radialGradient><radialGradient id="l3" cx="180" cy="520" r="420" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="rgb(0, 208, 107)" stop-opacity="0.1"/><stop offset=".62" stop-color="rgb(0, 208, 107)" stop-opacity="0"/></radialGradient>
<radialGradient id="tg" cx="80" cy="200" r="560" gradientUnits="userSpaceOnUse"><stop offset=".35" stop-color="#E0E2E4"/><stop offset="1" stop-color="#BFCAE2"/></radialGradient>
