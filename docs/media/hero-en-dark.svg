<rect width="1200" height="520" rx="20" fill="#1F1F20"/>
<rect width="1200" height="520" rx="20" fill="url(#l0)"/><rect width="1200" height="520" rx="20" fill="url(#l1)"/><rect width="1200" height="520" rx="20" fill="url(#l2)"/><rect width="1200" height="520" rx="20" fill="url(#l3)"/>
<g class="a" style="animation-name:end-stage">
<g class="a" style="animation-name:end-sc0;opacity:0"><text x="80" y="200" class="lb" font-size="15" fill="#818487">IN THE CLOUD</text><text x="80" y="248" class="t" font-size="32" font-weight="600" fill="url(#tg)">Muse works on a computer</text><text x="80" y="290" class="t" font-size="32" font-weight="600" fill="url(#tg)">of its own.</text></g><g class="a" style="animation-name:end-sc1;opacity:0"><text x="80" y="200" class="lb" font-size="15" fill="#818487">HANDS AND FEET</text><text x="80" y="248" class="t" font-size="32" font-weight="600" fill="url(#tg)">Local Gateway lets it reach</text><text x="80" y="290" class="t" font-size="32" font-weight="600" fill="url(#tg)">the one beside you.</text></g><g class="a" style="animation-name:end-sc2;opacity:0"><text x="80" y="200" class="lb" font-size="15" fill="#818487">AT THE WORKBENCH</text><text x="80" y="248" class="t" font-size="32" font-weight="600" fill="url(#tg)">A fenced shell, a shared folder,</text><text x="80" y="290" class="t" font-size="32" font-weight="600" fill="url(#tg)">the board on your desk.</text></g><g class="a" style="animation-name:end-sc3;opacity:1"><text x="80" y="200" class="lb" font-size="15" fill="#818487">ITS OWN EARS AND VOICE</text><text x="80" y="248" class="t" font-size="32" font-weight="600" fill="url(#tg)">Muse can build the gadget</text><text x="80" y="290" class="t" font-size="32" font-weight="600" fill="url(#tg)">it listens and speaks through.</text></g>
<line x1="80" y1="464" x2="120" y2="464" stroke="#383B3D" stroke-width="3" stroke-linecap="round"/><line class="a" x1="80" y1="464" x2="120" y2="464" stroke="#B5B7BB" stroke-width="3" stroke-linecap="round" stroke-dasharray="40" style="animation-name:end-seg0;animation-timing-function:linear;stroke-dashoffset:0"/><line x1="128" y1="464" x2="168" y2="464" stroke="#383B3D" stroke-width="3" stroke-linecap="round"/><line class="a" x1="128" y1="464" x2="168" y2="464" stroke="#B5B7BB" stroke-width="3" stroke-linecap="round" stroke-dasharray="40" style="animation-name:end-seg1;animation-timing-function:linear;stroke-dashoffset:0"/><line x1="176" y1="464" x2="216" y2="464" stroke="#383B3D" stroke-width="3" stroke-linecap="round"/><line class="a" x1="176" y1="464" x2="216" y2="464" stroke="#B5B7BB" stroke-width="3" stroke-linecap="round" stroke-dasharray="40" style="animation-name:end-seg2;animation-timing-function:linear;stroke-dashoffset:0"/><line x1="224" y1="464" x2="264" y2="464" stroke="#383B3D" stroke-width="3" stroke-linecap="round"/><line class="a" x1="224" y1="464" x2="264" y2="464" stroke="#B5B7BB" stroke-width="3" stroke-linecap="round" stroke-dasharray="40" style="animation-name:end-seg3;animation-timing-function:linear;stroke-dashoffset:0"/><text class="a m" x="284" y="469" font-size="13" fill="#818487" style="animation-name:end-sc0;opacity:0">1 / 4</text><text class="a m" x="284" y="469" font-size="13" fill="#818487" style="animation-name:end-sc1;opacity:0">2 / 4</text><text class="a m" x="284" y="469" font-size="13" fill="#818487" style="animation-name:end-sc2;opacity:0">3 / 4</text><text class="a m" x="284" y="469" font-size="13" fill="#818487" style="animation-name:end-sc3;opacity:1">4 / 4</text>
