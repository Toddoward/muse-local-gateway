<text class="a" x="716" y="314" fill="#E0E2E4" style="animation-name:end-l1">$ idf.py build</text>
<line class="a" x1="716" y1="326" x2="980" y2="326" stroke="#383B3D" stroke-width="4" stroke-linecap="round" style="animation-name:end-l1"/>
<line class="a" x1="716" y1="326" x2="980" y2="326" stroke="#B5B7BB" stroke-width="4" stroke-linecap="round" stroke-dasharray="264" style="animation-name:end-bar,end-barc"/>
<text class="a" x="716" y="356" fill="#E0E2E4" style="animation-name:end-l2">$ idf.py -p /dev/ttyACM0 flash</text>
<text class="a" x="716" y="380" fill="#818487" style="animation-name:end-l3">link.main: Muse Gadget starting</text>
<text class="a" x="716" y="416" fill="#B5B7BB" style="animation-name:end-blink;animation-duration:1s;animation-timing-function:steps(1)">$ _</text>
</g>
<!-- the gadget talks back to Muse over Wi-Fi -->
<path class="a" d="M1058 322 C 1090 250, 1070 150, 1000 128" fill="none" stroke="#818487" stroke-width="1.5" stroke-dasharray="4 6" style="animation-name:end-back;opacity:1"/>
</g>
